<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-55 Retirement Survey | LAAPOA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy:      #2B4C7E;
    --navy-mid:  #3D6BA8;
    --navy-deep: #2B5A9E;
    --gold:      #c8a84b;
    --line:      #d0dae8;
    --ink:       #1f2733;
    --muted:     #6b7688;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #2B5A9E 0%, #3D6BA8 50%, #2B4C7E 100%);
    padding: 40px 20px;
    line-height: 1.5;
    min-height: 100vh;
    color: var(--ink);
  }

  .container {
    max-width: 750px;
    margin: 0 auto;
    background-color: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    position: relative;
  }

  /* ---- clock watermark, blended into the card ---- */
  .clock-watermark {
    position: absolute;
    top: 190px;
    right: -110px;
    width: 420px;
    height: 420px;
    opacity: .07;
    pointer-events: none;
    z-index: 0;
  }
  .clock-watermark svg { width: 100%; height: 100%; display: block; }

  /* ---- lounge chair watermark behind the submit button ---- */
  .submit-wrap { position: relative; padding-bottom: 150px; }
  .submit-wrap .beach-watermark {
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    width: 320px;
    max-width: 90%;
    opacity: .22;
    pointer-events: none;
    z-index: 0;
  }
  .submit-wrap button { position: relative; z-index: 1; }

  .title-bar .logo {
    display: block;
    margin: 0 auto 14px;
    max-height: 110px;
    max-width: 80%;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
  }

  .title-bar {
    background: linear-gradient(180deg, var(--navy-deep), var(--navy));
    border-bottom: 4px solid var(--gold);
    color: #fff;
    padding: 26px 30px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .title-bar h1 {
    font-size: 26px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .title-bar p {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(255,255,255,.82);
  }

  form { padding: 34px 30px 40px; position: relative; z-index: 1; }

  .field { margin-bottom: 26px; }

  label.q {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: var(--navy);
    margin-bottom: 8px;
  }
  .hint { font-weight: normal; color: var(--muted); font-size: 12px; }

  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--navy-mid);
    box-shadow: 0 0 0 3px rgba(61,107,168,.15);
  }
  input.invalid { border-color: #b23b3b; }

  /* ---- DOB + live age ---- */
  .dob-row { display: flex; gap: 14px; align-items: stretch; }
  .dob-row .dob-input { flex: 1; }
  .age-box {
    width: 170px;
    flex-shrink: 0;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #f7f9fc;
    text-align: center;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: border-color .25s, background .25s;
  }
  .age-box.filled { border-color: var(--gold); background: #fffaf0; }
  .age-box .age-label {
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .age-box .age-value {
    font-size: 26px;
    font-weight: bold;
    color: var(--navy);
    line-height: 1.15;
  }
  .age-box .age-sub { font-size: 11px; color: var(--muted); line-height: 1.35; padding: 0 4px; }

  /* ---- choices ---- */
  .options { display: flex; gap: 12px; flex-wrap: wrap; }
  .options.stack { flex-direction: column; gap: 10px; }

  .opt {
    flex: 1 1 150px;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 14px 16px;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .opt:hover { border-color: var(--navy-mid); box-shadow: 0 2px 8px rgba(61,107,168,.15); }
  .opt input { width: 19px; height: 19px; accent-color: var(--navy-mid); cursor: pointer; flex-shrink: 0; }
  .opt .est {
    margin-left: auto;
    font-size: 12px;
    font-weight: bold;
    color: var(--navy-mid);
    background: #eef3fa;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px 10px;
    white-space: normal;
    text-align: right;
    line-height: 1.3;
    display: none;
  }
  .opt .est.show { display: inline-block; }
  .opt:has(input:checked) { border-color: var(--navy); background: #f4f8ff; font-weight: bold; color: var(--navy); }
  .opt:focus-within { outline: 2px solid var(--navy-mid); outline-offset: 2px; }

  .divider { height: 1px; background: var(--line); margin: 32px 0 28px; }

  button {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(180deg, var(--navy-deep), var(--navy));
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: filter .2s, transform .05s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:disabled { filter: grayscale(.6); cursor: not-allowed; }

  .status { margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; }
  .status.err { color: #b23b3b; }
  .status.ok  { color: #1e6f3a; }

  .footer-note {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,.85);
    margin: 22px auto 0;
    max-width: 750px;
  }

  .done {
    padding: 60px 30px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .done h2 { color: var(--navy); font-size: 22px; margin-bottom: 10px; }
  .done p { color: var(--muted); font-size: 14px; }

  @media (max-width: 560px) {
    body { padding: 20px 12px; }
    form { padding: 26px 18px 32px; }
    .title-bar h1 { font-size: 20px; }
    .dob-row { flex-direction: column; }
    .age-box { width: 100%; flex-direction: row; gap: 10px; padding: 12px; }
    .clock-watermark { width: 300px; height: 300px; right: -90px; top: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- clock watermark -->
  <div class="clock-watermark" aria-hidden="true">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#2B4C7E" stroke-linecap="round">
        <circle cx="100" cy="100" r="92" stroke-width="3"/>
        <circle cx="100" cy="100" r="82" stroke-width="1"/>
        <!-- hour ticks -->
        <g stroke-width="4">
          <line x1="100" y1="22" x2="100" y2="36"/>
          <line x1="100" y1="164" x2="100" y2="178"/>
          <line x1="22" y1="100" x2="36" y2="100"/>
          <line x1="164" y1="100" x2="178" y2="100"/>
        </g>
        <g stroke-width="3">
          <line x1="139" y1="29" x2="132" y2="41"/>
          <line x1="171" y1="61" x2="159" y2="68"/>
          <line x1="171" y1="139" x2="159" y2="132"/>
          <line x1="139" y1="171" x2="132" y2="159"/>
          <line x1="61" y1="171" x2="68" y2="159"/>
          <line x1="29" y1="139" x2="41" y2="132"/>
          <line x1="29" y1="61" x2="41" y2="68"/>
          <line x1="61" y1="29" x2="68" y2="41"/>
        </g>
        <!-- hands sitting just before the hour -->
        <line x1="100" y1="100" x2="100" y2="50" stroke-width="6"/>
        <line x1="100" y1="100" x2="139" y2="118" stroke-width="5"/>
      </g>
      <circle cx="100" cy="100" r="6" fill="#c8a84b"/>
    </svg>
  </div>

  <div class="title-bar">
    <img class="logo"
         src="https://github.com/LAAPOA/imageauthority/raw/main/3pinLogo.png"
         alt="Los Angeles Airport Peace Officers Association">
    <h1>Pre-55 Retirement Survey</h1>
    <p>Help LAAPOA plan benefit coverage for members retiring before age 55.</p>
  </div>

  <form id="survey" novalidate>

    <div class="field">
      <label class="q" for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" placeholder="First and last name">
    </div>

    <div class="field">
      <label class="q" for="dob">Date of Birth <span class="hint">— type it in, MM/DD/YYYY</span></label>
      <div class="dob-row">
        <div class="dob-input">
          <input type="text" id="dob" name="dob" inputmode="numeric" maxlength="10"
                 autocomplete="off" placeholder="MM/DD/YYYY">
        </div>
        <div class="age-box" id="ageBox">
          <span class="age-label">Age</span>
          <span class="age-value" id="ageValue">—</span>
          <span class="age-sub" id="ageSub">today</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="q" for="serial">Serial Number</label>
      <input type="text" id="serial" name="serial" inputmode="numeric" placeholder="e.g. 12345">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label class="q">Do you plan to participate in LAAPOA's Welfare and Benefits Trust for Pre-55 Retirees?</label>
      <div class="options">
        <label class="opt"><input type="radio" name="trust" value="Yes"> Yes</label>
        <label class="opt"><input type="radio" name="trust" value="No"> No</label>
        <label class="opt"><input type="radio" name="trust" value="Undecided"> Undecided</label>
      </div>
    </div>

    <div class="field">
      <label class="q">Projected retirement timeframe</label>
      <div class="options stack" id="timeframeOpts">
        <label class="opt"><input type="radio" name="timeframe" value="Within 12 months"> Within 12 months <span class="est" data-min="0" data-max="1"></span></label>
        <label class="opt"><input type="radio" name="timeframe" value="1-2 years"> 1 – 2 years <span class="est" data-min="1" data-max="2"></span></label>
        <label class="opt"><input type="radio" name="timeframe" value="3-5 years"> 3 – 5 years <span class="est" data-min="3" data-max="5"></span></label>
        <label class="opt"><input type="radio" name="timeframe" value="5+ years"> More than 5 years <span class="est" data-min="5" data-max=""></span></label>
        <label class="opt"><input type="radio" name="timeframe" value="Recently retired - benefits until 55"> I recently retired and would like to receive benefits &rsquo;til my 55th birthday <span class="est" data-to55="1"></span></label>
      </div>
    </div>

    <div class="submit-wrap">
      <img class="beach-watermark" aria-hidden="true"
           src="https://github.com/LAAPOA/imageauthority/raw/main/%E2%80%94Pngtree%E2%80%94lounge%20chair%20with%20a%20palm_15306350.png"
           alt="">
      <button type="submit" id="submitBtn">Submit Survey</button>
    </div>
    <div class="status" id="status"></div>

  </form>

  <div class="done" id="done" style="display:none;">
    <h2>Survey received</h2>
    <p>Thank you — your response has been recorded.</p>
  </div>

</div>

<p class="footer-note">Los Angeles Airport Peace Officers Association &middot; Responses are used for benefit planning only.</p>

<script>
  // ── Backend endpoint ───────────────────────────────────────────────
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmPYQhYV5KWNcIG1wBhfw6ZOZsCaefHQ8tArHXaabtiHwNPUvxXf6N8GCR1L5db2Ab/exec';

  const dob      = document.getElementById('dob');
  const ageBox   = document.getElementById('ageBox');
  const ageValue = document.getElementById('ageValue');
  const ageSub   = document.getElementById('ageSub');

  // Auto-format to MM/DD/YYYY while typing; digits only, no picker.
  dob.addEventListener('input', function (e) {
    const back = e.inputType === 'deleteContentBackward';
    let d = dob.value.replace(/\D/g, '').slice(0, 8);
    let out = d;
    if (d.length > 4)      out = d.slice(0,2) + '/' + d.slice(2,4) + '/' + d.slice(4);
    else if (d.length > 2) out = d.slice(0,2) + '/' + d.slice(2);
    else if (d.length === 2 && !back) out = d + '/';
    dob.value = out;
    updateAge();
    updateEstimates();
  });
  dob.addEventListener('blur', function () { updateAge(); updateEstimates(); });

  function parseDOB(str) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str.trim());
    if (!m) return null;
    const mo = +m[1], da = +m[2], yr = +m[3];
    if (mo < 1 || mo > 12 || da < 1 || da > 31) return null;
    if (yr < 1900 || yr > new Date().getFullYear()) return null;
    const dt = new Date(yr, mo - 1, da);
    if (dt.getFullYear() !== yr || dt.getMonth() !== mo - 1 || dt.getDate() !== da) return null;
    if (dt > new Date()) return null;
    return dt;
  }

  function calcAge(birth) {
    const now = new Date();
    let age = now.getFullYear() - birth.getFullYear();
    const m = now.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) age--;
    return age;
  }

  function timeTo55(birth) {
    const now = new Date();
    now.setHours(0,0,0,0);
    const fiftyFive = new Date(birth.getFullYear() + 55, birth.getMonth(), birth.getDate());
    if (fiftyFive <= now) return null;

    let totalMonths = (fiftyFive.getFullYear() - now.getFullYear()) * 12
                    + (fiftyFive.getMonth() - now.getMonth());
    let anchor = new Date(now.getFullYear(), now.getMonth() + totalMonths, now.getDate());
    if (anchor > fiftyFive) {
      totalMonths--;
      anchor = new Date(now.getFullYear(), now.getMonth() + totalMonths, now.getDate());
    }
    const years  = Math.floor(totalMonths / 12);
    const months = totalMonths % 12;
    const remDays = Math.round((fiftyFive - anchor) / 86400000);
    const weeks = Math.floor(remDays / 7);
    const days  = remDays % 7;

    return years + ' yr, ' + months + ' mo, ' + weeks + ' wk, ' + days + ' d';
  }

  function updateAge() {
    const birth = parseDOB(dob.value);
    if (!birth) {
      ageValue.textContent = '—';
      ageSub.textContent = 'today';
      ageBox.classList.remove('filled');
      dob.classList.toggle('invalid', dob.value.replace(/\D/g,'').length === 8);
      return;
    }
    dob.classList.remove('invalid');
    const age = calcAge(birth);
    ageValue.textContent = age;
    ageBox.classList.add('filled');

    const t = timeTo55(birth);
    ageSub.textContent = t === null ? 'age 55 reached' : 'to 55: ' + t;
  }

  // ── Estimated age per retirement timeframe ─────────────────────────
  const estTags = document.querySelectorAll('#timeframeOpts .est');

  function ageAt(birth, yearsFromNow) {
    const now = new Date();
    const future = new Date(now.getFullYear() + yearsFromNow, now.getMonth(), now.getDate());
    let a = future.getFullYear() - birth.getFullYear();
    const m = future.getMonth() - birth.getMonth();
    if (m < 0 || (m === 0 && future.getDate() < birth.getDate())) a--;
    return a;
  }

  function updateEstimates() {
    const birth = parseDOB(dob.value);
    estTags.forEach(function (tag) {
      if (!birth) {
        tag.classList.remove('show');
        tag.textContent = '';
        return;
      }
      if (tag.dataset.to55) {
        const t = timeTo55(birth);
        tag.textContent = t === null ? 'Age 55 reached' : 'Time until your 55th birthday: ' + t;
        tag.classList.add('show');
        return;
      }
      const min = parseInt(tag.dataset.min, 10);
      const max = tag.dataset.max === '' ? null : parseInt(tag.dataset.max, 10);
      let txt;
      if (max === null) {
        txt = 'Your age during this time frame: ' + ageAt(birth, min) + '+';
      } else {
        const a1 = ageAt(birth, min), a2 = ageAt(birth, max);
        txt = 'Your age during this time frame: ' + (a1 === a2 ? a1 : a1 + '\u2013' + a2);
      }
      tag.textContent = txt;
      tag.classList.add('show');
    });
  }

  // ── Submit ─────────────────────────────────────────────────────────
  const form   = document.getElementById('survey');
  const status = document.getElementById('status');
  const btn    = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.className = 'status';
    status.textContent = '';

    const name   = document.getElementById('name').value.trim();
    const serial = document.getElementById('serial').value.trim();
    const birth  = parseDOB(dob.value);
    const trust  = form.querySelector('input[name="trust"]:checked');
    const time   = form.querySelector('input[name="timeframe"]:checked');

    if (!name)   return fail('Enter your name.');
    if (!serial) return fail('Enter your serial number.');
    if (!birth)  return fail('Enter your date of birth as MM/DD/YYYY.');
    if (!trust)  return fail('Select an answer for the Welfare and Benefits Trust question.');
    if (!time)   return fail('Select a projected retirement timeframe.');

    const estTag = time.closest('.opt').querySelector('.est');

    const payload = {
      name:      name,
      serial:    serial,
      dob:       dob.value,
      age:       calcAge(birth),
      trust:     trust.value,
      timeframe: time.value,
      estAge:    estTag ? estTag.textContent : '',
      submitted: new Date().toString()
    };

    btn.disabled = true;
    btn.textContent = 'Submitting…';

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(function () {
      form.style.display = 'none';
      document.getElementById('done').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    })
    .catch(function () {
      btn.disabled = false;
      btn.textContent = 'Submit Survey';
      fail('Submission failed. Check your connection and try again.');
    });
  });

  function fail(msg) {
    status.className = 'status err';
    status.textContent = msg;
    return false;
  }
</script>

</body>
</html>
